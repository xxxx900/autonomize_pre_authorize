name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NURSE_TOKEN: ci-nurse-token
      ADMIN_TOKEN: ci-admin-token
      MCP_TOKEN: ci-mcp-token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint and test
        run: docker compose --profile test run --rm --build test

      - name: Start hapi, loader and api
        run: docker compose up -d --build api

      - name: Wait for api readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ready && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Seven-case check against the live endpoint
        run: >
          docker compose run --rm --no-deps -e API_URL=http://api:8000
          api python -m scripts.check_seven

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
