<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA Evidence Worksheet</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>PA Evidence Worksheet</h1>
  <p class="sub">Read-only. Reports evidence for a nurse to review. It does not recommend or decide.</p>
  <nav class="top">
    <a href="/audit/view">Audit log (admin)</a>
    <a href="/docs">API reference</a>
  </nav>

  <form class="bar" id="form">
    <label>Access token
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token">
    </label>
    <label>Request
      <select id="picker"></select>
    </label>
    <label>Summary model
      <select id="model"></select>
    </label>
    <button type="submit">Load packet</button>
  </form>

  <div id="error" class="error" hidden></div>
  <div id="out" hidden></div>
</main>

<script type="module">
"use strict";
import { el, add, factTable, savedToken, saveToken, getJson } from "/static/dom.js";

const ROUTE_TEXT = {
  evidence_complete: "Evidence complete: all five criteria are met in the record.",
  clinician_review: "Clinician review: at least one criterion is not met, missing or conflicting."
};
const STATUS_TEXT = { met: "met", not_met: "not met", missing: "missing", conflicting: "conflicting" };
const FALLBACK_TEXT = {
  not_configured: "no model is configured",
  unreachable: "the model was unreachable",
  model_error: "the model returned an error",
  bad_output: "the model output was malformed",
  rejected: "the model output failed the safety check"
};
const ERROR_TEXT = { 401: "Token missing or invalid.", 403: "Role not permitted.",
  404: "Unknown request or member.", 502: "Upstream FHIR problem." };
const tokenInput = document.getElementById("token");
const picker = document.getElementById("picker");
const modelPicker = document.getElementById("model");
const out = document.getElementById("out");
const errorBox = document.getElementById("error");

function ref(source) { return source.resource_type + "/" + source.id; }
function shown(value) { return value === null || value === undefined ? "(none)" : value; }

/** A reference as a link to the FHIR server when the packet carries one, else as plain code. */
function refLink(source, url) {
  const wrap = el("code");
  if (!url) { wrap.textContent = ref(source); return wrap; }
  const link = el("a", ref(source), "ref");
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  wrap.appendChild(link);
  return wrap;
}

/** One cited FHIR resource: its label, a link to the source, and the fields the rules read. */
function evidenceBlock(item) {
  const title = add(el("div", null, "item-title"),
    document.createTextNode(item.label + " "), refLink(item.ref, item.fhir_url));
  return add(el("div"), title, factTable(item.facts));
}

/** The FHIR link the packet holds for a reference, wherever it was cited. */
function urlFor(packet, source) {
  for (const c of packet.criteria) {
    for (const e of c.evidence) { if (ref(e.ref) === ref(source)) { return e.fhir_url; } }
  }
  return null;
}

function conflictTable(packet, conflicts) {
  const table = el("table", null, "cmp");
  table.appendChild(add(el("tr"), el("th", "Request form field"), el("th", "Request form says"),
    el("th", "FHIR record says"), el("th", "Record source")));
  for (const c of conflicts) {
    const src = el("td");
    if (c.record_source) { src.appendChild(refLink(c.record_source, urlFor(packet, c.record_source))); }
    else { src.textContent = "(none)"; }
    table.appendChild(add(el("tr"), el("td", c.field), el("td", shown(c.form_value)),
      el("td", shown(c.record_value)), src));
  }
  return table;
}

/** The policy clause and the record data behind one finding, folded so the card stays short. */
function provenance(packet, c) {
  const box = el("details", null, "prov");
  box.appendChild(el("summary", "Where this comes from: policy clause and record data"));
  box.appendChild(el("div", "Policy " + packet.policy_id + " v" + packet.policy_version + ", " +
    packet.policy_source.file + ", " + c.policy.section, "prov-head"));
  box.appendChild(factTable(c.policy.parameters));
  box.appendChild(el("div", "Member record (" + c.evidence.length + " resources)", "prov-head"));
  if (!c.evidence.length) { box.appendChild(el("span", "No record resource cited.", "note")); }
  for (const item of c.evidence) { box.appendChild(evidenceBlock(item)); }
  return box;
}

function criterionCard(packet, c) {
  const card = el("div", null, "card");
  card.appendChild(add(el("div", null, "head"), el("span", c.id, "cid"),
    el("span", c.requirement, "req"),
    el("span", STATUS_TEXT[c.status] || c.status, "pill " + c.status)));
  card.appendChild(el("p", c.rationale, "why"));
  if (c.conflicts.length) { card.appendChild(conflictTable(packet, c.conflicts)); }
  if (c.missing_document) {
    card.appendChild(el("p", "Ask the provider for: " + c.missing_document, "why"));
  }
  card.appendChild(provenance(packet, c));
  return card;
}

function section(title, body) {
  out.appendChild(el("h2", title));
  out.appendChild(body);
}

function missingList(items) {
  const box = el("div", null, "card");
  if (!items.length) { box.appendChild(el("span", "None", "note")); return box; }
  const list = el("ul", null, "plain");
  for (const d of items) { list.appendChild(el("li", d)); }
  box.appendChild(list);
  return box;
}

function flaggedList(items) {
  const box = el("div", null, "card");
  if (!items.length) { box.appendChild(el("span", "None", "note")); return box; }
  box.appendChild(el("p", "These hold free text the service never reads. Open them in the source system.", "note"));
  for (const item of items) { box.appendChild(evidenceBlock(item)); }
  return box;
}

function summaryCard(p) {
  const box = el("div", null, "card");
  if (!p.summary) { box.appendChild(el("span", "No summary for this packet.", "note")); return box; }
  box.appendChild(el("p", p.summary, "why"));
  const trace = p.trace ? p.trace.summary : null;
  let label = "Source: " + (p.summary_source || "not labelled");
  if (trace && trace.model) { label += ", model " + trace.model; }
  if (trace && trace.latency_ms !== null) { label += ", " + trace.latency_ms + " ms"; }
  if (trace && trace.fallback) {
    label += ". Template used because " + (FALLBACK_TEXT[trace.fallback] || trace.fallback);
  }
  box.appendChild(el("span", label, "tag"));
  return box;
}

function traceCard(p) {
  const box = el("div", null, "card");
  const t = p.trace;
  if (!t) { box.appendChild(el("span", "No trace.", "note")); return box; }
  box.appendChild(factTable([
    { field: "Trace id (X-Request-ID and audit request_id)", value: t.trace_id },
    { field: "Generated at", value: t.generated_at },
    { field: "Total time", value: t.duration_ms + " ms" },
    { field: "FHIR read", value: t.fhir_ms + " ms, " + t.fhir_resources_read + " resources" },
    { field: "Rules", value: t.rules_ms + " ms" },
    { field: "Cited-source check", value: t.source_check_ms + " ms" },
    { field: "Summary", value: t.summary.latency_ms === null ? "not called" : t.summary.latency_ms + " ms" },
    { field: "Policy file SHA-256", value: p.policy_source.sha256 }
  ]));
  const link = el("a", "Open the audit event for this packet (admin)", "ref");
  link.href = "/audit/view#request_id=" + encodeURIComponent(t.trace_id);
  box.appendChild(link);
  return box;
}

function render(p) {
  out.replaceChildren();
  const banner = el("div", null, "banner " + p.route);
  banner.appendChild(document.createTextNode(ROUTE_TEXT[p.route] || p.route));
  banner.appendChild(el("small", p.request_id + " · policy " + p.policy_id + " v" +
    p.policy_version + " (" + p.policy_source.title + ", effective " + p.policy_source.effective +
    ") · request date " + p.request_date));
  out.appendChild(banner);
  out.appendChild(el("h2", "Criteria"));
  for (const c of p.criteria) { out.appendChild(criterionCard(p, c)); }
  section("Missing documents", missingList(p.missing_documents));
  section("Flagged documents (listed, never rendered)", flaggedList(p.flagged_evidence));
  section("Summary", summaryCard(p));
  section("Trace", traceCard(p));
  out.hidden = false;
}

function fail(message) {
  out.hidden = true;
  errorBox.textContent = message;
  errorBox.hidden = false;
}

function option(value, label) {
  const node = el("option", label || value);
  node.value = value;
  return node;
}

async function load(id) {
  errorBox.hidden = true;
  const token = tokenInput.value.trim();
  if (!token) { fail("Enter an access token."); return; }
  saveToken(token);
  if (!picker.options.length) { await fillPickers(token); }
  const query = modelPicker.value ? "?summary_model=" + encodeURIComponent(modelPicker.value) : "";
  let result;
  try { result = await getJson("/requests/" + encodeURIComponent(id) + "/evidence" + query, token); }
  catch (e) { fail("Could not reach the service."); return; }
  if (result.ok) { render(result.body); return; }
  fail("Request failed (" + result.status + "). " + (ERROR_TEXT[result.status] || "") +
    (result.traceId ? " Trace id " + result.traceId + "." : ""));
}

/** Fill the request and model dropdowns from GET /catalog, which needs a token. */
async function fillPickers(token) {
  let result;
  try { result = await getJson("/catalog", token); } catch (e) { return; }
  if (!result.ok) { return; }
  const wanted = picker.value || decodeURIComponent((location.hash || "").slice(1));
  picker.replaceChildren(...result.body.request_ids.map((id) => option(id)));
  if (result.body.request_ids.includes(wanted)) { picker.value = wanted; }
  const models = result.body.summary_models;
  modelPicker.replaceChildren(...models.choices.map((m) =>
    option(m, m === models.default ? m + " (default)" : m)));
  modelPicker.value = models.default;
}

tokenInput.value = savedToken();
if (tokenInput.value) {
  await fillPickers(tokenInput.value);
  if (picker.value && location.hash) { load(picker.value); }
}
tokenInput.addEventListener("change", () => fillPickers(tokenInput.value.trim()));
document.getElementById("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  history.replaceState(null, "", "#" + picker.value);
  load(picker.value);
});
</script>
</body>
</html>
