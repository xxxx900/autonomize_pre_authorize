services:
  hapi:
    image: hapiproject/hapi:v8.12.0-2
    ports:
      - "${HAPI_HOST_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${HAPI_JAVA_OPTS:--Xms512m -Xmx2g}
    restart: unless-stopped

  loader:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.load_fhir"]
    environment:
      FHIR_BASE_URL: http://hapi:8080/fhir
      FHIR_AUTH_MODE: none
    depends_on:
      - hapi

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.12.6
    entrypoint: ["sh", "-c", "for m in $$MODELS; do ollama pull $$m || exit 1; done"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_PULL_MODELS:-qwen2.5:3b-instruct-q4_K_M llama3.2:3b-instruct-q4_K_M}
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      FHIR_BASE_URL: http://hapi:8080/fhir
      FHIR_AUTH_MODE: ${FHIR_AUTH_MODE:-none}
      FHIR_BEARER_TOKEN: ${FHIR_BEARER_TOKEN:-}
      FHIR_TOKEN_URL: ${FHIR_TOKEN_URL:-}
      FHIR_CLIENT_ID: ${FHIR_CLIENT_ID:-}
      FHIR_CLIENT_SECRET: ${FHIR_CLIENT_SECRET:-}
      FHIR_SCOPE: ${FHIR_SCOPE:-system/*.read}
      NURSE_TOKEN: ${NURSE_TOKEN:?set NURSE_TOKEN in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      AUDIT_DB_PATH: /data/audit.db
      EXTRA_REQUESTS_DIR: ${EXTRA_REQUESTS_DIR:-/srv/eval/synthea_requests}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_URL: http://ollama:11434
      SUMMARY_MODEL: ${SUMMARY_MODEL:-llama3.2:3b-instruct-q4_K_M}
      SUMMARY_MODEL_CHOICES: ${SUMMARY_MODEL_CHOICES:-qwen2.5:3b-instruct-q4_K_M}
      SUMMARY_TIMEOUT_SECONDS: ${SUMMARY_TIMEOUT_SECONDS:-30}
      FHIR_PUBLIC_BASE_URL: ${FHIR_PUBLIC_BASE_URL:-http://localhost:${HAPI_HOST_PORT:-8080}/fhir}
      MCP_HEALTH_URL: http://mcp:8001/health
    volumes:
      - audit-data:/data
    depends_on:
      hapi:
        condition: service_started
      loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  mcp:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "${MCP_HOST_PORT:-8001}:8001"
    environment:
      FHIR_BASE_URL: http://hapi:8080/fhir
      FHIR_AUTH_MODE: ${FHIR_AUTH_MODE:-none}
      FHIR_BEARER_TOKEN: ${FHIR_BEARER_TOKEN:-}
      FHIR_TOKEN_URL: ${FHIR_TOKEN_URL:-}
      FHIR_CLIENT_ID: ${FHIR_CLIENT_ID:-}
      FHIR_CLIENT_SECRET: ${FHIR_CLIENT_SECRET:-}
      FHIR_SCOPE: ${FHIR_SCOPE:-system/*.read}
      NURSE_TOKEN: ${NURSE_TOKEN:?set NURSE_TOKEN in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      OLLAMA_URL: http://ollama:11434
      SUMMARY_MODEL: ${SUMMARY_MODEL:-llama3.2:3b-instruct-q4_K_M}
      SUMMARY_MODEL_CHOICES: ${SUMMARY_MODEL_CHOICES:-qwen2.5:3b-instruct-q4_K_M}
      SUMMARY_TIMEOUT_SECONDS: ${SUMMARY_TIMEOUT_SECONDS:-30}
      AUDIT_DB_PATH: /data/audit.db
      EXTRA_REQUESTS_DIR: ${EXTRA_REQUESTS_DIR:-/srv/eval/synthea_requests}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FHIR_PUBLIC_BASE_URL: ${FHIR_PUBLIC_BASE_URL:-http://localhost:${HAPI_HOST_PORT:-8080}/fhir}
    volumes:
      - audit-data:/data
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  agent:
    profiles: ["agent"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "agent.agent"]
    environment:
      MCP_URL: http://mcp:8001/mcp
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      OLLAMA_URL: http://ollama:11434
      AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:3b-instruct-q4_K_M}
    depends_on:
      - mcp

  fetch-synthea:
    profiles: ["synthea"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.fetch_synthea"]
    volumes:
      - ./resources/synthea:/srv/resources/synthea

  run-eval:
    profiles: ["eval"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "eval.run_eval"]
    environment:
      API_URL: http://api:8000
      FHIR_BASE_URL: http://hapi:8080/fhir
      NURSE_TOKEN: ${NURSE_TOKEN:?set NURSE_TOKEN in .env}
    volumes:
      - ./eval/results:/srv/eval/results
    depends_on:
      api:
        condition: service_started

  measure:
    profiles: ["eval"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "eval.measure_models"]
    environment:
      OLLAMA_URL: http://ollama:11434
      MEASURE_MODELS: ${MEASURE_MODELS:-qwen2.5:3b-instruct-q4_K_M llama3.2:3b-instruct-q4_K_M}
      MEASURE_RUNS: ${MEASURE_RUNS:-5}
      MEASURE_OUTPUT: ${MEASURE_OUTPUT:-models}
    volumes:
      - ./eval/results:/srv/eval/results
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      NURSE_TOKEN: test-nurse-token
      ADMIN_TOKEN: test-admin-token

volumes:
  audit-data:
  ollama-data:
